tenant_id: cu_alpha
product: mockbank_core
product_version: "2.3"
base_url: "http://localhost:8000"
credentials:
  username_env: MOCKBANK_USER
  password_env: MOCKBANK_PASSWORD
overrides: {}
# PII on screen that is not an artifact target. Keep cu_beta aligned.
#   td.cap + td : every caption/value cell on Member Summary (number, names, SSN, DOB, phone, email, address)
#   td.acctno   : account numbers in the Accounts table
mask_selectors:
  - "td.cap + td"
  - "td.acctno"
# Reviewed UI chrome exempt from the screenshot rule that masks every leaf showing a digit. Keep in sync
# across tenants. Only static text belongs here; mask_selectors still win inside these regions.
#   table.statusbar td : screen code, branch / workstation, product version ("MBR100", "Core v2.3")
#   td.hint            : field help text ("Digits only, up to 10 characters.")
unmask_selectors:
  - "table.statusbar td"
  - "td.hint"
# Partial values in EVIDENCE SCREENSHOTS only (DOM dumps, logs and the LLM stay fully masked).
# A masked cell without a rule here (Date of Birth, Address, City, balances) is hidden completely.
screenshot_reveal:
  - { selector: "td.cap + td", caption: "Member Number", style: last, keep: 2 }
  - { selector: "td.cap + td", caption: "Name", style: initials }
  - { selector: "td.cap + td", caption: "First Name", style: initials }
  - { selector: "td.cap + td", caption: "Last Name", style: initials }
  - { selector: "td.cap + td", caption: "SSN", style: last, keep: 4 }
  - { selector: "td.cap + td", caption: "Phone", style: last, keep: 2 }
  - { selector: "td.cap + td", caption: "Email", style: email }
  - { selector: "td.cap + td", caption: "State", style: keep }
  - { selector: "td.cap + td", caption: "ZIP", style: last, keep: 2 }
  - { selector: "td.acctno", style: last, keep: 4 }
