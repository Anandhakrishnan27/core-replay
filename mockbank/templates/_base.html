{#- Shared shell. Legacy on purpose: tables only, no element ids or test hooks. -#}
<html>
<head>
<title>MockBank Core</title>
{% block head %}{% endblock %}
<style>
  body { font-family: Verdana, Arial, sans-serif; font-size: 12px; background: #f4f4ec; margin: 8px; }
  td.hdr { background: #003366; color: #ffffff; font-weight: bold; font-size: 14px; padding: 4px; }
  td.cap { font-weight: bold; text-align: right; padding-right: 6px; }
  th { background: #c8c8b4; text-align: left; padding: 2px 6px; }
  td.amt { text-align: right; }
  .msg { color: #990000; font-weight: bold; }
  div.sysnotice { border: 2px solid #996600; background: #fff8dc; width: 420px; padding: 6px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
