{% extends "_base.html" %}
{% block body %}
<table width="100%" cellpadding="0" cellspacing="0">
  <tr><td class="hdr">Member Summary</td></tr>
</table>
<br>
<table border="0" cellpadding="3">
  <tr><td class="cap">Member Number</td><td>{{ member.member_id }}</td></tr>
  <tr><td class="cap">Name</td><td>{{ member.name }}</td></tr>
</table>
<br>
<b>Accounts</b>
<table border="1" cellpadding="3" cellspacing="0">
  <tr><th>Account Type</th><th>Balance</th><th>Status</th></tr>
  {% for acct in member.accounts %}
  <tr><td>{{ acct.account_type }}</td><td class="amt">{{ acct.balance }}</td><td>{{ acct.status }}</td></tr>
  {% endfor %}
</table>
<br>
<a href="/console/mbrlookup">New Search</a>
{% endblock %}
