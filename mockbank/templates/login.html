{% extends "_base.html" %}
{% block body %}
<table width="100%" cellpadding="0" cellspacing="0">
  <tr><td class="hdr">MockBank Core</td></tr>
</table>
<br>
{% if expired %}<p class="msg">Your session has expired. Please sign on again.</p>{% endif %}
{% if invalid %}<p class="msg">Invalid user ID or password</p>{% endif %}
<form name="signon" method="post" action="/login" target="_top">
<table border="0" cellpadding="3">
  <tr><td colspan="2"><b>Sign On</b></td></tr>
  <tr><td class="cap">User ID</td><td><input type="text" name="userid" size="16"></td></tr>
  <tr><td class="cap">Password</td><td><input type="password" name="password" size="16"></td></tr>
  <tr><td></td><td><input type="submit" value="Sign On"></td></tr>
</table>
</form>
{% endblock %}
