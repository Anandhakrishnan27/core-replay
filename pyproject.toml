[project]
name = "core-replay"
version = "0.1.0"
description = "CoreReplay: reliable AI-agent capabilities for legacy core banking systems without APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "playwright==1.63.0",  # pinned: observe() relies on aria_snapshot(mode="ai") and aria-ref locators
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "packaging>=24",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua", "mockbank"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# one event loop for the whole run, so a single Chromium is shared by all browser tests
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# str+Enum kept deliberately: JSON-friendly values in Pydantic models
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"cua/handoff/recorder.py" = ["E501"]  # embedded JavaScript
"cua/surface/engines.py" = ["E501"]  # embedded JavaScript
"cua/surface/aria.py" = ["E501"]  # embedded JavaScript

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
