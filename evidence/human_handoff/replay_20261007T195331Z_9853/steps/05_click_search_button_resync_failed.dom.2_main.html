<html><head>
<title>MockBank Core</title>

<style>
  body { font-family: Tahoma, Verdana, Arial, sans-serif; font-size: 12px; color: #1a1a1a;
         background: #e9e7dd; margin: 0; }
  table { font-size: inherit; }  /* no doctype (legacy): quirks mode tables would not inherit */
  a { color: #1f3a68; }
  a:hover { color: #b35900; }

  /* title bar (the screen code is in the status bar) */
  table.titlebar { border-bottom: 2px solid #c9a227; }
  td.hdr { background: #1f3a68; background-image: linear-gradient(#2f5597, #1f3a68); color: #ffffff;
           font-weight: bold; font-size: 14px; padding: 5px 8px; letter-spacing: 0.3px; }

  div.content { padding: 12px 14px; }

  /* section title above a data table */
  table.sect { margin-top: 4px; }
  table.sect td { color: #1f3a68; font-weight: bold; font-size: 12px; border-bottom: 1px solid #a7a38f;
                  padding: 2px 0; }
  table.box { background: #f7f6f0; border: 1px solid #a7a38f; margin: 6px 0 12px 0; }

  /* caption/value detail (captions right-aligned, values plain) */
  td.cap { font-weight: bold; text-align: right; padding-right: 8px; color: #3a3a3a; white-space: nowrap; }
  td.hint { color: #6b6b5e; font-size: 11px; }

  /* data grid */
  table.grid { border-collapse: collapse; background: #ffffff; margin: 6px 0 12px 0; }
  table.grid th { background: #d8d4c0; background-image: linear-gradient(#e6e3d3, #d1cdb7); text-align: left;
                  padding: 3px 8px; border: 1px solid #a7a38f; font-size: 11px; }
  table.grid td { padding: 3px 8px; border: 1px solid #c8c4b0; }
  table.grid tr:nth-child(odd) td { background: #f6f5ef; }
  td.amt { text-align: right; font-family: "Courier New", Courier, monospace; }
  td.acctno { font-family: "Courier New", Courier, monospace; }

  /* controls */
  input[type=text], input[type=password] { border: 1px solid #7f9db9; padding: 2px 3px; font-size: 12px;
                                           font-family: "Courier New", Courier, monospace; background: #ffffff; }
  input[type=text]:focus, input[type=password]:focus { background: #fffbe0; outline: 1px solid #c9a227; }
  input[type=submit] { font-family: Tahoma, Verdana, Arial, sans-serif; font-size: 12px; min-width: 76px;
                       padding: 2px 10px; background: #ece9d8; border: 1px solid #003c74; border-radius: 3px; }
  input[type=submit]:hover { background: #fff3c4; }
  div.content > a { display: inline-block; padding: 2px 10px; border: 1px solid #7f7f6a; border-radius: 3px;
              background: #ece9d8; color: #1a1a1a; text-decoration: none; }
  div.content > a:hover { background: #fff3c4; }

  /* message boxes; the glyph is CSS so it never becomes page text */
  table.msgbox { border: 1px solid #a7a38f; background: #ffffff; margin: 4px 0 12px 0; min-width: 460px; }
  table.msgbox td.glyph { width: 28px; text-align: center; vertical-align: top; padding: 8px 4px; }
  table.msgbox td.glyph::before { display: inline-block; width: 20px; height: 20px; line-height: 20px;
                                  border-radius: 10px; color: #ffffff; font-weight: bold; content: "i";
                                  background: #2f5597; }
  table.msgbox.warn td.glyph::before { content: "!"; background: #b35900; }
  table.msgbox.err td.glyph::before { content: "x"; background: #a01818; }
  table.msgbox td.text { padding: 8px 10px 8px 2px; }
  .msg { color: #990000; font-weight: bold; margin: 0; }

  /* status bar (in flow, so it never covers a control) */
  table.statusbar { border-top: 1px solid #a7a38f; background: #d4d0c8; color: #3a3a3a; font-size: 11px; }
  table.statusbar td { padding: 3px 8px; }
  td.scr, td.code { font-family: "Courier New", Courier, monospace; white-space: nowrap; width: 1%; }
  table.statusbar td.scr { border-right: 1px solid #a7a38f; color: #1f3a68; }  /* not bold: observe() reads bold cells as captions */

  /* navigation frame */
  body.nav { background: #dfe4ee; border-right: 1px solid #8a9bb8; min-height: 100%; }
  td.brand { color: #c9d6ee; font-size: 10px; padding: 2px 8px 6px 8px; background: #1f3a68; }
  td.grp { color: #5a6a86; font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
           padding: 10px 8px 3px 8px; border-bottom: 1px solid #b4c0d6; }
  td.item { padding: 3px 8px 3px 14px; }
  td.item a { text-decoration: none; }
  td.item a:hover { text-decoration: underline; }
  td.off { padding: 3px 8px 3px 14px; color: #9aa3b3; }

  /* sign-on page */
  table.dialog { border: 1px solid #1f3a68; background: #f7f6f0; box-shadow: 2px 2px 0 #a7a38f; }
  td.dlgbody { padding: 12px 16px; }
  td.inst { color: #1f3a68; font-size: 11px; padding-bottom: 6px; }
  td.banner { background: #fff8dc; border-top: 1px solid #d9c27a; color: #5c4a00; font-size: 11px;
              padding: 6px 16px; }

  /* interstitial dialog */
  body.backdrop { background: #8f8d84; }
  div.sysnotice { border: 1px solid #996600; background: #fff8dc; width: 420px; padding: 0;
                  box-shadow: 3px 3px 0 #5f5d55; text-align: left; }
  td.dlgtitle { background: #c9a227; background-image: linear-gradient(#ddb94a, #b8901c); color: #2b2200; }
</style>
</head>
<body>

<table class="titlebar" width="100%" cellpadding="0" cellspacing="0">
  <tbody><tr><td class="hdr">MockBank Core v2.3</td></tr>
</tbody></table>
<div class="content">

<table class="msgbox" cellpadding="0" cellspacing="0">
  <tbody><tr><td class="glyph"></td><td class="text">Welcome to Brindlewood Federal Credit Union. Select a function from the menu.<br>
    <span class="hint">Greyed items are not enabled for this workstation.</span></td></tr>
</tbody></table>

</div>
<table class="statusbar" width="100%" cellpadding="0" cellspacing="0">
  <tbody><tr><td class="scr">MB000</td><td>Branch 001 · Workstation WS-04</td><td align="right">Core v2.3</td></tr>
</tbody></table>


</body></html>
